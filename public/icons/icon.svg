<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E3F2FD"/>
      <stop offset="100%" stop-color="#BBDEFB"/>
    </linearGradient>
    <!-- Cell gradients -->
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9C4"/><stop offset="100%" stop-color="#FFF176"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F7FA"/><stop offset="100%" stop-color="#B2EBF2"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F5E9"/><stop offset="100%" stop-color="#C8E6C9"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E3F2FD"/><stop offset="100%" stop-color="#90CAF9"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/><stop offset="100%" stop-color="#FFE0B2"/>
    </linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3E5F5"/><stop offset="100%" stop-color="#E1BEE7"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#90A4AE" flood-opacity="0.25"/>
    </filter>
    <filter id="cellShadow" x="-8%" y="-8%" width="116%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#546E7A" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Main background -->
  <rect x="8" y="8" width="496" height="496" rx="108" ry="108" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" ry="104" fill="none" stroke="#90CAF9" stroke-width="1.5" opacity="0.4"/>

  <!-- ===== GRID CELLS ===== -->
  <!-- Row 1 -->
  <rect x="56" y="56" width="124" height="124" rx="24" ry="24" fill="url(#g1)" filter="url(#cellShadow)"/>
  <rect x="194" y="56" width="124" height="124" rx="24" ry="24" fill="url(#g2)" filter="url(#cellShadow)"/>
  <rect x="332" y="56" width="124" height="124" rx="24" ry="24" fill="url(#g3)" filter="url(#cellShadow)"/>
  <!-- Row 2 -->
  <rect x="56" y="194" width="124" height="124" rx="24" ry="24" fill="url(#g4)" filter="url(#cellShadow)"/>
  <rect x="194" y="194" width="124" height="124" rx="24" ry="24" fill="url(#g5)" filter="url(#cellShadow)"/>
  <rect x="332" y="194" width="124" height="124" rx="24" ry="24" fill="url(#g6)" filter="url(#cellShadow)"/>

  <!-- ===== 1. SUN (weather) ===== -->
  <g transform="translate(118, 118)">
    <!-- Rays -->
    <g stroke="#FFA726" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-38" x2="0" y2="-28"/>
      <line x1="0" y1="28" x2="0" y2="38"/>
      <line x1="-38" y1="0" x2="-28" y2="0"/>
      <line x1="28" y1="0" x2="38" y2="0"/>
      <line x1="-27" y1="-27" x2="-20" y2="-20"/>
      <line x1="20" y1="-20" x2="27" y2="-27"/>
      <line x1="-27" y1="27" x2="-20" y2="20"/>
      <line x1="20" y1="20" x2="27" y2="27"/>
    </g>
    <!-- Sun body -->
    <circle cx="0" cy="0" r="20" fill="#FFD54F"/>
    <circle cx="0" cy="-2" r="17" fill="#FFECB3" opacity="0.5"/>
    <!-- Face -->
    <circle cx="-6" cy="-3" r="2.5" fill="#6D4C41"/>
    <circle cx="6" cy="-3" r="2.5" fill="#6D4C41"/>
    <path d="M-6,5 Q0,11 6,5" fill="none" stroke="#6D4C41" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-12" cy="4" r="4" fill="#FFAB91" opacity="0.4"/>
    <circle cx="12" cy="4" r="4" fill="#FFAB91" opacity="0.4"/>
  </g>

  <!-- ===== 2. CLOCK (timetable) ===== -->
  <g transform="translate(256, 118)">
    <circle cx="0" cy="0" r="32" fill="white"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#0277BD" stroke-width="5"/>
    <!-- Hour marks -->
    <g fill="#0277BD">
      <circle cx="0" cy="-26" r="2.5"/><circle cx="0" cy="26" r="2.5"/>
      <circle cx="26" cy="0" r="2.5"/><circle cx="-26" cy="0" r="2.5"/>
    </g>
    <!-- Hands -->
    <line x1="0" y1="2" x2="0" y2="-16" stroke="#0D47A1" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="2" x2="14" y2="10" stroke="#0277BD" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#0D47A1"/>
  </g>

  <!-- ===== 3. CHECKLIST (to-do) ===== -->
  <g transform="translate(394, 118)">
    <g transform="translate(0,-22)">
      <rect x="-22" y="-6" width="12" height="12" rx="3" fill="white" stroke="#2E7D32" stroke-width="2.5"/>
      <polyline points="-19,-1 -16,3 -12,-3" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-4" y1="0" x2="22" y2="0" stroke="#455A64" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(0,0)">
      <rect x="-22" y="-6" width="12" height="12" rx="3" fill="white" stroke="#2E7D32" stroke-width="2.5"/>
      <polyline points="-19,-1 -16,3 -12,-3" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-4" y1="0" x2="22" y2="0" stroke="#455A64" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(0,22)">
      <rect x="-22" y="-6" width="12" height="12" rx="3" fill="white" stroke="#78909C" stroke-width="2.5"/>
      <line x1="-4" y1="0" x2="22" y2="0" stroke="#B0BEC5" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ===== 4. BOOK (subjects) ===== -->
  <g transform="translate(118, 256)">
    <!-- Book body -->
    <rect x="-28" y="-32" width="56" height="64" rx="5" ry="5" fill="#1E88E5"/>
    <rect x="-24" y="-28" width="48" height="56" rx="3" ry="3" fill="#E3F2FD"/>
    <!-- Spine -->
    <rect x="-28" y="-32" width="10" height="64" rx="5" ry="0" fill="#1565C0"/>
    <!-- Lines -->
    <line x1="-10" y1="-10" x2="20" y2="-10" stroke="#90CAF9" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-10" y1="2" x2="20" y2="2" stroke="#90CAF9" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-10" y1="14" x2="10" y2="14" stroke="#90CAF9" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- ===== 5. UTENSILS (meals) ===== -->
  <g transform="translate(256, 256)">
    <!-- Fork -->
    <g transform="translate(-14, 0)">
      <line x1="0" y1="-30" x2="0" y2="32" stroke="#6D4C41" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="-8" y1="-30" x2="-8" y2="-12" stroke="#6D4C41" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="8" y1="-30" x2="8" y2="-12" stroke="#6D4C41" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-8,-12 Q-8,-6 0,-4 Q8,-6 8,-12" fill="none" stroke="#6D4C41" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Spoon -->
    <g transform="translate(14, 0)">
      <line x1="0" y1="4" x2="0" y2="32" stroke="#6D4C41" stroke-width="4.5" stroke-linecap="round"/>
      <ellipse cx="0" cy="-12" rx="12" ry="18" fill="#D7CCC8" stroke="#6D4C41" stroke-width="3"/>
    </g>
  </g>

  <!-- ===== 6. CALENDAR (schedule) ===== -->
  <g transform="translate(394, 256)">
    <!-- Calendar body -->
    <rect x="-30" y="-26" width="60" height="56" rx="8" ry="8" fill="white" stroke="#5C6BC0" stroke-width="3.5"/>
    <!-- Header -->
    <rect x="-30" y="-26" width="60" height="18" rx="8" ry="8" fill="#5C6BC0"/>
    <rect x="-30" y="-14" width="60" height="6" fill="#5C6BC0"/>
    <!-- Hooks -->
    <line x1="-14" y1="-32" x2="-14" y2="-22" stroke="#3949AB" stroke-width="4" stroke-linecap="round"/>
    <line x1="14" y1="-32" x2="14" y2="-22" stroke="#3949AB" stroke-width="4" stroke-linecap="round"/>
    <!-- Grid -->
    <g fill="#5C6BC0" opacity="0.7">
      <rect x="-20" y="-2" width="10" height="8" rx="2"/>
      <rect x="-5" y="-2" width="10" height="8" rx="2"/>
      <rect x="10" y="-2" width="10" height="8" rx="2"/>
      <rect x="-20" y="12" width="10" height="8" rx="2"/>
      <rect x="-5" y="12" width="10" height="8" rx="2"/>
      <rect x="10" y="12" width="10" height="8" rx="2"/>
    </g>
    <!-- Today highlight -->
    <rect x="-5" y="12" width="10" height="8" rx="2" fill="#FF7043"/>
  </g>

  <!-- ===== APP NAME ===== -->
  <g transform="translate(256, 390)">
    <rect x="-100" y="-22" width="200" height="44" rx="22" ry="22" fill="white" opacity="0.6"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="700" fill="#37474F" letter-spacing="2">스마트 보드</text>
  </g>
</svg>
